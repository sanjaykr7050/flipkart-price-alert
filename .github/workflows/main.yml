name: Flipkart price alert
concurrency:
  group: flipkart-price-alert
  cancel-in-progress: false
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download bot code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Flipkart price
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_NAME: Horlicks Nutrition Drink Jar
          PRODUCT_URL: https://www.flipkart.com/horlicks-nutrition-drink-jar/p/itmfaa093d013a02?pid=MDMETGMUEHP2YJDZ&lid=LSTMDMETGMUEHP2YJDZDWIND1&marketplace=GROCERY
          TARGET_PRICE: "380"
          PIN_CODE: "827009"
          HEADLESS: "true"
          RUN_ONCE: "true"
        run: python bot.py

      - name: Save alert state
        run: |
          git config user.name "price-alert-bot"
          git config user.email "price-alert-bot@users.noreply.github.com"
          git add alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update price alert state"
            git push
          fi
